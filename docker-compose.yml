services:
  app:
    build: ./
    volumes:
      - .:/workdir
    ports:
      - 8000:8000
  db:
    image: mysql:8.3
    volumes:
      - ./laravel_app/mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is not set. Copy .env.example to .env and set it.}
      MYSQL_DATABASE: ${DB_DATABASE:-dev}
    ports:
      - 127.0.0.1:3306:3306
